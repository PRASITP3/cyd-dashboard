; Claude Token Dashboard — ESP32 CYD (ESP32-2432S028, ILI9341 2.8")
[env:cyd]
platform    = espressif32
board       = esp32dev
framework   = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.0
    tzapu/WiFiManager @ ^2.0.17
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    https://github.com/squix78/esp8266-oled-ssd1306.git

; TFT_eSPI configured via build_flags (no need to edit library's User_Setup.h)
build_flags =
    ; Tell TFT_eSPI to skip its own User_Setup.h
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; CYD GPIO pinout (TFT)
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    ; XPT2046 Touch (VSPI: separate from TFT HSPI)
    -D TOUCH_MISO=39
    -D TOUCH_MOSI=32
    -D TOUCH_SCLK=25
    -D TOUCH_CS=33
    -D TOUCH_IRQ=36
    ; Load fonts
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
